<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bollfort</title>
    <meta
      name="description"
      content="Bollfort: a castle siege game for two to eight players. Shoot down the walls of your opponents' castles, then race to rebuild your own before the next barrage."
    />
    <!-- The page's own dark, for the browser's bar where it takes the page's colour. -->
    <meta name="theme-color" content="#0a0a12" />
    <!-- The app's icon, the red B, as the desktop app's window has it: without one the browser
         asks for /favicon.ico, and the server answers an unknown path with this page. -->
    <link rel="icon" href="/store/shortcut_icon.ico" sizes="any" />
    <link rel="icon" href="/store/shortcut_icon.png" type="image/png" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main id="app"></main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

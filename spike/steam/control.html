<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Bollfort Steam spike</title>
    <style>
      body {
        font:
          14px system-ui,
          sans-serif;
        background: #15181f;
        color: #e8e8ea;
        margin: 16px;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 8px;
      }
      h2 {
        font-size: 14px;
        margin: 16px 0 6px;
        color: #d8b84a;
      }
      button {
        margin: 2px 4px 2px 0;
        padding: 6px 10px;
        background: #262b36;
        color: #e8e8ea;
        border: 1px solid #3a4150;
        border-radius: 6px;
        cursor: pointer;
      }
      button:hover {
        border-color: #d8b84a;
      }
      table {
        border-collapse: collapse;
      }
      td {
        padding: 2px 10px 2px 0;
        vertical-align: top;
      }
      td:first-child {
        color: #9aa0ab;
      }
      #log {
        height: 300px;
        overflow: auto;
        background: #0d0f14;
        padding: 8px;
        font:
          12px ui-monospace,
          monospace;
        white-space: pre-wrap;
        border-radius: 6px;
      }
      .warn {
        color: #ec6a6a;
      }
    </style>
  </head>
  <body>
    <h1>Bollfort Steam spike (App ID 480)</h1>

    <h2>Notes</h2>
    <input id="note" placeholder="step, e.g. 4 or 5a" size="16" />
    <button onclick="mark()">Mark in log</button>
    <button onclick="spike.copy()">Copy state and log</button>
    <button onclick="spike.restart()">Restart clean</button>

    <h2>Host</h2>
    <button onclick="spike.host('friends')">Host: Friends lobby</button>
    <button onclick="spike.host('public')">Host: Public lobby</button>
    <button onclick="spike.host('private')">Host: Invite only</button>

    <h2>Invite (Q2, Q4) — try as host and as guest</h2>
    <button onclick="spike.invite()">Invite (lobby.openInviteDialog)</button>
    <button onclick="spike.overlayInvite()">Invite (overlay.activateInviteDialog)</button>
    <button onclick="spike.friends()">Open the overlay's friends</button>

    <h2>Join</h2>
    <button onclick="list()">List our lobbies</button>
    <span id="lobbies"></span><br />
    <input id="lobbyId" placeholder="lobby id" size="24" />
    <button onclick="spike.join(document.getElementById('lobbyId').value.trim())">
      Join by id
    </button>

    <h2>Extras</h2>
    <button onclick="spike.keyboard()">Steam's gamepad keyboard (Big Picture / Deck)</button>

    <h2>State</h2>
    <table id="state"></table>

    <h2>Controllers this page sees (Steam Input pass-through)</h2>
    <div id="pads">none</div>

    <h2>Log</h2>
    <div id="log"></div>

    <script>
      const logEl = document.getElementById('log');
      spike.onLog((line) => {
        const div = document.createElement('div');
        if (/fail|refused|error|DURING A MATCH/i.test(line)) div.className = 'warn';
        div.textContent = line;
        logEl.append(div);
        logEl.scrollTop = logEl.scrollHeight;
      });
      const rows = [
        [
          'Steam user',
          (s) => (s.name ? `${s.name} (${s.steamId})` : `not initialised: ${s.initError}`),
        ],
        ['restartAppIfNecessary', (s) => s.restart],
        ['On a Steam Deck', (s) => s.onDeck],
        ['Steam language', (s) => s.language],
        ['Started with', (s) => s.argv],
        ['Role', (s) => s.role],
        ['Lobby', (s) => (s.lobby ? `${s.lobby} (${s.lobbyType ?? 'joined'})` : '—')],
        ['Room', (s) => s.room ?? '—'],
        [
          'Round trip over Steam',
          (s) =>
            s.rtt === null
              ? '—'
              : `now ${s.rtt} ms, highest ${s.rttMax} ms, mean ${s.rttMean} ms (${s.rttCount} pings)`,
        ],
        [
          'Host silent > 3 s',
          (s) =>
            `${s.stalls} times, longest ${(s.longestStallMs / 1000).toFixed(1)} s` +
            (s.stallNow > 0 ? ` — SILENT NOW for ${(s.stallNow / 1000).toFixed(0)} s` : ''),
        ],
        [
          'Sent',
          (s) =>
            `${s.sentPackets} packets, ${(s.sentBytes / 1024).toFixed(0)} KB, largest ${s.largestPacket} B, failures ${s.sendFailures}`,
        ],
        ['Read', (s) => `${s.readPackets} packets, ${(s.readBytes / 1024).toFixed(0)} KB`],
        ['Sockets opened', (s) => `${s.socketsOpened} (in a match: ${s.socketsOpenedInMatch})`],
        ['Log file', (s) => s.logFile ?? 'none'],
      ];
      function mark() {
        const input = document.getElementById('note');
        spike.note(input.value);
        input.value = '';
      }
      document.getElementById('note').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') mark();
      });
      spike.onState((s) => {
        document.getElementById('state').innerHTML = rows
          .map(([k, f]) => `<tr><td>${k}</td><td>${String(f(s)).replace(/</g, '&lt;')}</td></tr>`)
          .join('');
      });
      async function list() {
        const lobbies = await spike.list();
        document.getElementById('lobbies').innerHTML = lobbies.length
          ? lobbies
              .map(
                (l) => `<button onclick="spike.join('${l.id}')">${l.host} (${l.members})</button>`,
              )
              .join('')
          : 'none of ours found';
      }
      setInterval(() => {
        const pads = [...navigator.getGamepads()].filter(Boolean);
        document.getElementById('pads').textContent = pads.length
          ? pads.map((p) => `${p.index}: ${p.id} (${p.mapping || 'no mapping'})`).join(' | ')
          : 'none (press a button on the pad with this window focused)';
      }, 1000);
    </script>
  </body>
</html>
